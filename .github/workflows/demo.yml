name: Hugging Face Space demo

on:
  pull_request:
    paths:
      - "demo/**"
      - "tests/test_hf_space_demo.py"
      - "experiments/wlcr_sea_model.py"
      - "experiments/missingness_protocol.py"
      - "Model/traffic_window_forecasting.py"
      - "requirements.txt"
      - ".github/workflows/demo.yml"
      - ".github/workflows/hugging-face-space.yml"
  push:
    branches:
      - main
    paths:
      - "demo/**"
      - "tests/test_hf_space_demo.py"
      - "experiments/wlcr_sea_model.py"
      - "experiments/missingness_protocol.py"
      - "Model/traffic_window_forecasting.py"
      - "requirements.txt"
      - ".github/workflows/demo.yml"
      - ".github/workflows/hugging-face-space.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: space-demo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CPU demo dependencies
        run: >-
          python -m pip install
          --extra-index-url https://download.pytorch.org/whl/cpu
          numpy==1.26.4
          pandas==2.2.3
          matplotlib==3.9.2
          gradio==6.25.0
          spaces
          torch==2.8.0+cpu

      - name: Run method-demo tests
        env:
          MPLBACKEND: Agg
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
          TORCH_NUM_THREADS: "2"
        run: python -m unittest tests.test_hf_space_demo -v

      - name: Build the Gradio interface
        env:
          MPLBACKEND: Agg
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: python -c "from demo.app import demo; assert demo is not None"
