name: Sync Hugging Face Space

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hugging-face-space-production
  cancel-in-progress: true

jobs:
  sync:
    name: Synchronize public CPU-only Space
    runs-on: ubuntu-latest
    env:
      HF_SPACE_ID: config-h/WLCR-SEA_Predictor
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require the repository-scoped Hugging Face token
        run: >-
          test -n "${HF_TOKEN}" ||
          (echo "Add a write-enabled HF_TOKEN as this repository's Actions secret." && exit 1)

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Create the public Gradio Space
        run: >-
          uvx hf repos create "${HF_SPACE_ID}"
          --type space
          --sdk gradio
          --public
          --exist-ok

      # A free account can return HTTP 402 when an existing ZeroGPU Space is
      # downgraded. The app never requests a GPU, so publishing must continue.
      - name: Request CPU Basic hardware when available
        continue-on-error: true
        run: >-
          uv run --with huggingface-hub python -c
          'import os; from huggingface_hub import HfApi, SpaceHardware;
          HfApi(token=os.environ["HF_TOKEN"]).request_space_hardware(
          repo_id=os.environ["HF_SPACE_ID"], hardware=SpaceHardware.CPU_BASIC)'

      - name: Prepare the minimal inference repository
        run: |
          HF_SPACE_STAGE="$(mktemp -d "${RUNNER_TEMP}/hugging-face-space.XXXXXX")"
          printf 'HF_SPACE_STAGE=%s\n' "${HF_SPACE_STAGE}" >> "${GITHUB_ENV}"
          mkdir -p "${HF_SPACE_STAGE}/demo/examples" "${HF_SPACE_STAGE}/experiments" "${HF_SPACE_STAGE}/Model"
          cp demo/__init__.py demo/app.py demo/model_loader.py demo/runtime.py "${HF_SPACE_STAGE}/demo/"
          cp demo/examples/synthetic_traffic.csv "${HF_SPACE_STAGE}/demo/examples/"
          cp experiments/__init__.py experiments/wlcr_sea_model.py experiments/missingness_protocol.py "${HF_SPACE_STAGE}/experiments/"
          cp Model/traffic_window_forecasting.py "${HF_SPACE_STAGE}/Model/"
          cp LICENSE "${HF_SPACE_STAGE}/LICENSE"
          cp requirements-demo.txt "${HF_SPACE_STAGE}/requirements.txt"
          cp demo/space-readme-frontmatter.md "${HF_SPACE_STAGE}/README.md"

      - name: Mirror the minimal runtime to Hugging Face
        run: >-
          uvx hf upload "${HF_SPACE_ID}" "${HF_SPACE_STAGE}" .
          --type space
          --delete "*"
          --commit-message "Sync inference runtime from ${GITHUB_REPOSITORY}"
          --commit-description "GitHub commit ${GITHUB_SHA}"
