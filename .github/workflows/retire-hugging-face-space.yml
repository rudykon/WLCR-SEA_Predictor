name: Retire hosted Demo

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hugging-face-space-production
  cancel-in-progress: false

jobs:
  retire:
    name: Pause and privatize the former hosted Demo
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Verify the retirement target and idempotence
        run: uv run python -m unittest tests.test_retire_hf_space -q

      - name: Retire only the Space and verify public model availability
        run: uv run --with huggingface-hub python tools/retire_hf_space.py
