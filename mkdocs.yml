site_name: WLCR-SEA Predictor
site_url: https://rudykon.github.io/WLCR-SEA_Predictor/
site_description: >-
  Forecast one cell's traffic over the next 24 hours from its recent data,
  with explicit missing-value handling and an inspectable calculation record.

repo_name: rudykon/WLCR-SEA_Predictor
repo_url: https://github.com/rudykon/WLCR-SEA_Predictor
edit_uri: edit/main/docs/

exclude_docs: |
  README.md
  CODE_STRUCTURE.md
  REPRODUCTION_GUIDE.md
  RESEARCH_REPRODUCTION.md

theme:
  name: material
  language: en
  logo: assets/brand/logo-icon.svg
  favicon: assets/brand/favicon.svg
  font: false
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search:
      lang: en
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 简体中文
          build: true
          site_name: WLCR-SEA 蜂窝流量预测
          site_description: >-
            根据单个小区的近期数据预测未来 24 小时流量，明确处理缺失值，并保留可供检查的计算记录。
          theme:
            palette:
              - media: "(prefers-color-scheme: light)"
                scheme: default
                primary: custom
                accent: custom
                toggle:
                  icon: material/weather-night
                  name: 切换至深色模式
              - media: "(prefers-color-scheme: dark)"
                scheme: slate
                primary: custom
                accent: custom
                toggle:
                  icon: material/weather-sunny
                  name: 切换至浅色模式
          nav_translations:
            Home: 首页
            Get started: 开始使用
            Installation: 安装
            Quick start: 快速开始
            Business scenarios: 业务场景
            Architecture: 架构
            Method: 方法
            How it works: 方法原理
            CSV input format: CSV 输入格式
            Research: 研究
            Results: 实验结果
            Limitations: 适用边界
            Demo: 在线演示
            Live Demo: 在线 Demo
            Reference: 参考
            Code map: 代码地图
            Reproduction: 复现

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - "https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap"
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rudykon
      name: rudykon on GitHub
    - icon: fontawesome/solid/face-smile
      link: https://huggingface.co/spaces/config-h/WLCR-SEA_Predictor
      name: WLCR-SEA method demo on Hugging Face
  generator: false

copyright: Copyright &copy; 2026 WLCR-SEA contributors · Apache-2.0

nav:
  - Home: index.md
  - Get started:
      - Installation: getting-started/installation.md
      - Quick start: getting-started/quickstart.md
  - Business scenarios: guide/problem.md
  - Architecture: guide/architecture.md
  - Method:
      - How it works: guide/method.md
      - CSV input format: guide/data-contract.md
  - Research:
      - Results: research/evidence.md
      - Limitations: research/limitations.md
  - Demo:
      - Live Demo: deployment/hugging-face.md
  - Reference:
      - Code map: reference/code-map.md
      - Reproduction: reference/reproduction.md
